name: Pipeline

# Texto → Compilação → Artefatos. Cada job é uma etapa do fluxo do README.
# Ações de terceiros fixadas por SHA (mesma disciplina do refarm/vault-seed).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      refarm_proof:
        description: "Rodar a prova de consumo dos contratos do refarm (clona o refarm)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DEMO: examples/eco-house-demo

jobs:
  lint:
    name: Lint (YAML, Python, Shell)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      - run: uv sync --frozen
      - name: Ruff (lint + formato)
        run: |
          uv run ruff check core tests
          uv run ruff format --check core tests
      - name: yamllint (dados, perfis, workflows)
        run: uv run yamllint -s .
      - name: Shell e Node (sintaxe)
        run: |
          bash -n scripts/cli_runner.sh
          node --check scripts/vendor_refarm.mjs
          node --check scripts/test_refarm_contracts.mjs

  test:
    name: Testes do core
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      - run: uv sync --frozen
      - run: uv run pytest -q

  build:
    name: Build (relatório, quantitativos, quality:v1, manifest)
    needs: [lint, test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      - run: uv sync --frozen
      - name: arch-engine build (falha se o perfil de qualidade tiver `fail`)
        run: uv run arch-engine build "$DEMO"
      - name: Resumo no job
        run: |
          {
            echo "## Relatório da demo"
            cat "$DEMO/artifacts/relatorio.md"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: eco-house-demo-relatorios
          path: |
            ${{ env.DEMO }}/artifacts/
            ${{ env.DEMO }}/cad/gen/

  cad:
    name: CAD (OpenSCAD → OFF/STL/PNG → OBJ → .sh3d)
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      - run: uv sync --frozen
      - name: OpenSCAD + Xvfb (o PNG precisa de contexto OpenGL)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q openscad xvfb
          openscad --version
      - run: scripts/cli_runner.sh build
      - run: scripts/cli_runner.sh cad
      - run: scripts/cli_runner.sh sh3d
      - run: scripts/cli_runner.sh manifest
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: eco-house-demo-cad
          path: |
            ${{ env.DEMO }}/cad/render/
            ${{ env.DEMO }}/artifacts/manifest.json

  refarm-proof:
    # Prova de consumo dos contratos do refarm. Manual enquanto os pacotes
    # @refarm.dev não estão no npm (demanda P0 em docs/ECOSYSTEM-DEMANDS.md):
    # precisa clonar o refarm e gerar o packet de handoff localmente.
    name: Prova de consumo (refarm)
    if: github.event_name == 'workflow_dispatch' && inputs.refarm_proof
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: aretw0/refarm
          path: refarm
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      - run: uv sync --frozen
      - name: Gerar o packet de handoff do refarm
        working-directory: refarm
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm run release:vault-seed:handoff
      - name: Vendorizar, instalar e provar
        env:
          REFARM_ROOT: ${{ github.workspace }}/refarm
        run: |
          npm run vendor:refarm
          npm install --no-package-lock
          uv run arch-engine build "$DEMO"
          npm run test:refarm
